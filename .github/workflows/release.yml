name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyinstaller mutagen certifi
      - name: Build .app
        run: pyinstaller PodcastSync.spec --noconfirm
      - name: Zip the .app
        run: cd dist && zip -r PodcastSync-mac.zip PodcastSync.app
      - name: Upload mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist/PodcastSync-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyinstaller mutagen certifi
      - name: Build .exe
        run: pyinstaller PodcastSync.spec --noconfirm
      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/PodcastSync.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mac build
        uses: actions/download-artifact@v4
        with:
          name: mac-build
      - name: Download windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PodcastSync-mac.zip
            PodcastSync.exe
          generate_release_notes: true
